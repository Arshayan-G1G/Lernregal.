<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lernregal</title>
<meta name="description" content="Lernmodule nach Fach sortiert: Biologie, Geschichte, Französisch, Englisch – mit Zusammenfassungen, Übungen und Übungsprüfungen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f3f4f7; --card:#ffffff; --fg:#14161c; --muted:#5d6271; --line:#dcdfe7;
  --bio:#23804f; --chem:#6a43c9; --ges:#b04a21; --fra:#2457b8; --eng:#0b7d86;
  --deu:#a3366b; --mat:#8a6a00; --inf:#3b5bdb; --geo:#5b7a1e; --other:#5d6271;
  --f-display:"Archivo",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101217; --card:#181b22; --fg:#e8eaf0; --muted:#9aa0ae; --line:#2a2e38;
  --bio:#5fcf92; --chem:#a88cf5; --ges:#f08a5d; --fra:#7aa6ff; --eng:#4fd0d8;
  --deu:#f07fb5; --mat:#e3c14f; --inf:#8ea6ff; --geo:#a9d16a; --other:#9aa0ae; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-display);padding-inline:16px;padding-block:0 56px}
.wrap{max-width:1040px;margin:0 auto}
header{padding-block:32px 18px}
h1{font:900 clamp(38px,9vw,72px)/.92 var(--f-display);font-stretch:118%;letter-spacing:-.02em;margin:0}
.sub{color:var(--muted);margin:12px 0 0;max-width:56ch}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
.chip{flex:none;font:700 14px/1 var(--f-display);color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:9px 13px;cursor:pointer;display:flex;align-items:center;gap:7px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--fg))}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip small{font:500 12px var(--f-mono);opacity:.7}
#q{flex:0 1 220px;min-width:0;font:inherit;font-size:15px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 14px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
section{padding-top:30px}
section h2{font:800 clamp(24px,5vw,34px)/1 var(--f-display);font-stretch:112%;margin:0 0 14px;display:flex;align-items:baseline;gap:10px;color:var(--c)}
section h2 small{font:500 13px var(--f-mono);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mod{position:relative;display:flex;flex-direction:column;gap:8px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0;transition:border-color .15s,transform .15s}
.mod:hover{border-color:var(--c)}
.mod h3{font:800 19px/1.2 var(--f-display);margin:0}
.mod h3 a{color:var(--fg);text-decoration:none}
.mod h3 a::after{content:"";position:absolute;inset:0;border-radius:8px}
.mod p{margin:0;color:var(--muted);font-size:14.5px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font:700 11px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--c);border:1px solid currentColor;border-radius:99px;padding:4px 8px}
.tag.neu{background:var(--c);border-color:var(--c);color:var(--card)}
.stand{display:flex;flex-direction:column;gap:5px;font:500 12.5px var(--f-mono);color:var(--fg)}
.stand .pb{height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.stand .pb i{display:block;height:100%;background:var(--c);border-radius:99px}
.acts{display:flex;align-items:center;gap:12px}
.share{position:relative;z-index:1;font:700 13px/1 var(--f-display);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:7px 11px;cursor:pointer}
.share:hover{border-color:var(--c)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px;font:500 12px var(--f-mono);color:var(--muted)}
.foot b{font:700 14px var(--f-display);color:var(--c)}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px}
.btn{font:700 15px/1 var(--f-display);color:var(--bg);background:var(--fg);border:1px solid var(--fg);border-radius:99px;padding:12px 18px;cursor:pointer;text-decoration:none}
.btn.ghost{color:var(--fg);background:var(--card);border-color:var(--line)}
#anfrage{margin-top:44px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px 16px}
#anfrage h2{color:var(--fg);margin-bottom:6px}
#anfrage .sub{margin:0 0 16px}
#anfrageForm{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
#anfrageForm label{display:flex;flex-direction:column;gap:5px;font:700 12px/1.2 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
#anfrageForm .full{grid-column:1/-1}
#anfrageForm input,#anfrageForm select,#anfrageForm textarea{font:400 15px/1.4 var(--f-display);letter-spacing:0;text-transform:none;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
#anfrageForm textarea{min-height:96px;resize:vertical}
#anfrageForm .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.formrow{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.msg{font-size:14px;color:var(--muted)}
.msg.ok{color:var(--bio)}
.msg.err{color:var(--ges)}
.empty,.state{color:var(--muted);margin:0}
.state{padding-top:30px}
@media (prefers-reduced-motion:no-preference){.mod:hover{transform:translateY(-2px)}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Lernregal</h1>
    <p class="sub">Alle Lernmodule an einem Ort, nach Fach sortiert. Antippen öffnet das Modul.</p>
  </div>
  <a class="btn ghost" href="#anfrage" id="anfrageLink" hidden>Modul anfragen</a>
</header>

<div class="bar">
  <div class="chips" id="chips" role="group" aria-label="Fach filtern"></div>
  <input id="q" type="search" placeholder="Suchen…" aria-label="Module durchsuchen">
</div>

<div id="shelves"></div>

<section id="anfrage" hidden>
  <h2>Modul anfragen</h2>
  <p class="sub">Dir fehlt ein Thema? Schreib, was du brauchst. Die Anfrage kommt direkt beim Betreiber des Regals an.</p>
  <form id="anfrageForm">
    <label for="aFach">Fach<select id="aFach" name="Fach" required></select></label>
    <label for="aDatum">Prüfung am (optional)<input id="aDatum" name="Prüfungsdatum" type="date"></label>
    <label class="full" for="aThema">Was soll ins Modul?<textarea id="aThema" name="Thema" required maxlength="1500" placeholder="z.B. Chemie Kapitel 2: Atombau und Periodensystem, mit Übungsprüfung"></textarea></label>
    <label for="aName">Dein Name (optional)<input id="aName" name="Name" maxlength="80" autocomplete="name"></label>
    <label class="hp" aria-hidden="true">Nicht ausfüllen<input type="checkbox" name="botcheck" tabindex="-1"></label>
    <div class="formrow"><button class="btn" type="submit" id="aSend">Anfrage senden</button><span class="msg" id="aMsg" role="status"></span></div>
  </form>
</section>
</div>

<script>
/* ===== Neues Modul eintragen: HTML-Datei in den Ordner "module" legen
   und hier eine Zeile ergänzen. Fach muss genau so heissen wie unten in FAECHER. ===== */
const MODULE=[
{fach:"Deutsch",titel:"Übungsprüfung bfK 2",text:"Zweite Prüfung im Aufbau der Nachprüfung 2025 mit neuen Sätzen: Gross/Klein, Laute, das/dass, Teufelswörter, Fehlerkorrektur, Kommasetzung, 60 Punkte mit Note.",tags:["Übungsprüfung","Test"],datum:"2026-10-18",datei:"module/deutsch-uebungspruefung-bfk-2.html"},
{fach:"Informatik",titel:"EVA & Kontrollstrukturen",text:"EVA (2) und Kapitel 3: EVA-Prinzip, for- und while-Schleifen, if/elif/else, Vergleichsoperatoren und Einrückung. Mit Labor für alle Aufgaben 3.1 bis 3.15 und Quiz.",tags:["Lernseite","Übungen","Quiz"],datum:"2026-10-17",datei:"module/informatik-eva-kontrollstrukturen.html"},
{fach:"Deutsch",titel:"Übungsprüfung bfK",text:"Prüfung im Aufbau der Nachprüfung 2025: Gross/Klein, Laute, das/dass, Teufelswörter, Fehlerkorrektur, Kommasetzung und Kommaregeln, 60 Punkte mit Note.",tags:["Übungsprüfung","Test"],datum:"2026-10-17",datei:"module/deutsch-uebungspruefung-bfk.html"},
{fach:"Deutsch",titel:"Rechtschreibung BFK",text:"Lange/kurze Silben, Stammprinzip, gleich klingende Wörter, das/dass, Bindestrich und 100 Dauerbrenner mit über 250 Übungen, Fehlerjagd und Mix-Test.",tags:["Lernseite","Übungen","Test"],datum:"2026-10-17",datei:"module/deutsch-rechtschreibung-bfk.html"},
{fach:"Deutsch",titel:"Kommasetzung",text:"Alle Kommaregeln inkl. Gefühlskommas, Adjektiv-Probe und Konjunktionen mit/ohne Komma, mit Tricks und 128 Übungen.",tags:["Lernseite","Übungen","Grammatik"],datum:"2026-10-16",datei:"module/deutsch-kommasetzung.html"},
 {fach:"Geografie",titel:"Topografie Schweiz",text:"Orientierungswissen auf der Karte: Seen, Flüsse, Gebirge mit Gipfeln, Gletscher, Pässe, Orte und Regionen.",tags:["Quiz","Karte","Lernkarten"],datum:"2026-10-14",datei:"module/geografie-topografie-schweiz.html"},
 {fach:"Geografie",titel:"Geo P1 Nachhaltigkeit",text:"Prüfung 20.10.: Geosphäre, Atlas, Umweltprobleme, Nachhaltigkeit, Ressourcen/Reserven, 5 Wirtschaftsmodelle, Coltan-Mystery, Arktis, Fast Fashion, Einkaufen.",tags:["Zusammenfassung","Quiz"],datum:"2026-10-14",datei:"module/geografie-nachhaltigkeit-p1.html"},
 {fach:"Französisch",titel:"Grammaire Répétition",text:"Grammatik 1. Klasse: Plural, Feminin, Komparativ, Adverb, Artikel und Teilungsartikel, Possessiv, tout, Pronomen, qui/que, Passé composé reflexiv, Verneinung. Über 300 Übungen und Mischtest.",tags:["Lernseite","Übungen","Test"],datum:"2026-10-13",datei:"module/franzoesisch-grammatik.html"},
 {fach:"Englisch",titel:"English Grammar Workout",text:"Alle Zeitformen, Passiv/Aktiv, Indirect Questions und Question Tags: Theorie und über 100 Übungen mit Mix-Test.",tags:["Lernseite","Übungen","Quiz"],datum:"2026-10-12",datei:"module/englisch-grammatik.html"},
 {fach:"Informatik",titel:"Python & Turtle-Grafik",text:"Die 8 Lernziele von Kapitel 1 und 2: Computer, Geschichte, Compiler/Interpreter, Shell, print, Turtle und Variablen. Mit Turtle-Labor und Quiz.",tags:["Lernseite","Übungen","Quiz"],datum:"2026-10-17",datei:"module/informatik-python-turtle.html"},
 {fach:"Biologie",titel:"Bio Einleitung Lernpfad",text:"Lebensmerkmale, Organsysteme, Fachgebiete, 5 Reiche, DRASKOFGA mit Tiertabelle, Homologie und Evolution.",tags:["Zusammenfassung","Training","Übungsprüfung"],datum:"2026-10-12",datei:"module/bio-einleitung.html"},
 {fach:"Biologie",titel:"Bio Übungsmodul Kapitel 1–3",text:"Theorie und Quiz zu allen Kapiteln der Einleitung, mit Prüfungssimulation.",tags:["Übungen","Übungsprüfung"],datum:"2026-10-06",datei:"module/bio-uebungen.html"},
 {fach:"Geschichte",titel:"Lernatlas Mittelmeer",text:"GSW: Mittelmeer als heterogener Raum, Arabischer Frühling, Syrienkrieg, Flucht und Migration. 9 Lernziele.",tags:["Zusammenfassung","Übungen","Übungsprüfung"],datum:"2026-09-15",datei:"module/mittelmeer.html"},
 {fach:"Französisch",titel:"Lernpfad Vocabulaire I",text:"Wortschatz Dossier S. 1–6: Identität, Aussehen, Körper, die fünf Sinne. Mit Prüfungssimulation.",tags:["Vokabeln","Übungsprüfung"],datum:"2026-09-15",datei:"module/vocabulaire-1.html"},
 {fach:"Englisch",titel:"Vokabel Quiz",text:"Karteikarten Deutsch → Englisch: 192 Wörter aus Lektion 2–4, Unit 3 und Culture.",tags:["Vokabeln","Karteikarten"],datum:"2026-09-09",datei:"module/vokabel-quiz.html"}
];

const FAECHER=[
 {name:"Biologie",c:"var(--bio)",immer:1},{name:"Chemie",c:"var(--chem)",immer:1},{name:"Geschichte",c:"var(--ges)",immer:1},
 {name:"Französisch",c:"var(--fra)",immer:1},{name:"Englisch",c:"var(--eng)",immer:1},
 {name:"Deutsch",c:"var(--deu)"},{name:"Mathematik",c:"var(--mat)"},{name:"Informatik",c:"var(--inf)"},{name:"Geografie",c:"var(--geo)"}
];

let active="Alle";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d||"");return m?`${m[3]}.${m[2]}.${m[1]}`:""};
try{const f=localStorage.getItem("fach");if(f)active=f;}catch(e){}

function faecher(){
  const extra=[...new Set(MODULE.map(m=>m.fach).filter(s=>!FAECHER.some(x=>x.name===s)))].map(n=>({name:n,c:"var(--other)"}));
  return FAECHER.concat(extra).filter(s=>s.immer||MODULE.some(m=>m.fach===s.name));
}
function chips(){
  const subs=faecher();
  if(active!=="Alle"&&!subs.some(s=>s.name===active))active="Alle";
  const all=[{name:"Alle",c:"var(--fg)",n:MODULE.length}].concat(subs.map(s=>({...s,n:MODULE.filter(m=>m.fach===s.name).length})));
  $("chips").innerHTML=all.map(s=>`<button class="chip" type="button" data-n="${esc(s.name)}" aria-pressed="${s.name===active}" style="--c:${s.c}"><i></i>${esc(s.name)} <small>${s.n}</small></button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{active=b.dataset.n;try{localStorage.setItem("fach",active)}catch(e){};chips();render();});
}
function render(){
  const q=$("q").value.trim().toLowerCase();let html="",shown=0;
  faecher().filter(s=>active==="Alle"||s.name===active).forEach(s=>{
    const all=MODULE.filter(m=>m.fach===s.name);
    const mods=all.filter(m=>!q||[m.titel,m.text,m.tags.join(" "),s.name].join(" ").toLowerCase().includes(q)).sort((a,b)=>b.datum.localeCompare(a.datum));
    if(!mods.length&&(q||all.length))return;
    shown++;
    html+=`<section style="--c:${s.c}"><h2>${esc(s.name)}<small>${mods.length} ${mods.length===1?"Modul":"Module"}</small></h2>`+
      (mods.length?`<div class="grid">`+mods.map(karte).join("")+`</div>`:`<p class="empty">Noch keine Module.</p>`)+`</section>`;
  });
  $("shelves").innerHTML=shown?html:'<p class="state">Nichts gefunden. Probier ein anderes Wort.</p>';
}
function karte(m){
  const st=stand(m.datei);
  return `<article class="mod"><h3><a href="${esc(m.datei)}">${esc(m.titel)}</a></h3><p>${esc(m.text)}</p>`+
    `<div class="tags">${istNeu(m.datum)?'<span class="tag neu">Neu</span>':""}${m.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`+
    (st?`<div class="stand"><span>Dein Stand: ${esc(st.text)}</span>${typeof st.pct==="number"?`<div class="pb"><i style="width:${Math.max(0,Math.min(100,st.pct))}%"></i></div>`:""}</div>`:"")+
    `<div class="foot"><span>${fmt(m.datum)}</span><span class="acts"><button class="share" type="button" data-datei="${esc(m.datei)}" aria-label="${esc(m.titel)} teilen">Teilen</button><b>Öffnen →</b></span></div></article>`;
}

/* ===== «Neu» = in den letzten 7 Tagen hinzugefügt oder aktualisiert ===== */
function istNeu(d){const t=new Date(d+"T00:00:00").getTime();return !isNaN(t)&&(Date.now()-t)<7*864e5;}

/* ===== Dein Stand: liest, was die Module im Browser gespeichert haben ===== */
const ls=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const json=(k,d)=>{try{const v=ls(k);return v?JSON.parse(v):d}catch(e){return d}};
const STAND={
  "module/bio-uebungen.html":()=>{const b=json("bio-best",{});const n=Object.keys(b).filter(k=>k!=="exam").length;
    if(!n&&b.exam==null)return null;
    return {text:[b.exam!=null?"Prüfung "+b.exam+" %":"",n?n+"/10 Kapitel geübt":""].filter(Boolean).join(" · "),pct:b.exam!=null?b.exam:n*10};},
  "module/mittelmeer.html":()=>{const g=json("mm26.goals",[]);return g.length?{text:g.length+"/10 Lernziele abgehakt",pct:Math.round(g.length/10*100)}:null;},
  "module/vocabulaire-1.html":()=>{const s=json("kswo-voc-1",null);const b=s&&s.best||{};const n=Object.keys(b).length;
    if(!n)return null;return b.exam!=null?{text:"Prüfung "+b.exam+" %",pct:b.exam}:{text:n+"/12 Etappen geübt",pct:Math.round(n/12*100)};}
};
function stand(datei){
  if(STAND[datei]){try{const r=STAND[datei]();if(r)return r;}catch(e){}}
  const g=json("lernregal:"+datei,null);
  return g&&g.text?g:null;
}

/* ===== Teilen: Handy = Teilen-Menü (WhatsApp usw.), Computer = Link kopieren ===== */
$("shelves").addEventListener("click",async e=>{
  const b=e.target.closest(".share");if(!b)return;
  const m=MODULE.find(x=>x.datei===b.dataset.datei);if(!m)return;
  const url=new URL(m.datei,location.href).href;
  if(navigator.share){try{await navigator.share({title:m.titel,text:m.titel+" – Lernregal",url});}catch(err){}return;}
  try{await navigator.clipboard.writeText(url);b.textContent="Link kopiert ✓";}
  catch(err){window.open("https://wa.me/?text="+encodeURIComponent(m.titel+" – Lernregal "+url),"_blank","noopener");}
  setTimeout(()=>{b.textContent="Teilen";},2000);
});
$("q").oninput=render;
chips();render();

/* ===== Modul-Anfragen: werden per Web3Forms als E-Mail verschickt.
   Der Access Key ist kein Geheimnis (steht für eine E-Mail-Adresse). Leer = Anfrage-Bereich ausgeblendet. ===== */
const ANFRAGE_KEY="dc1ab860-89ff-4fe3-b6a0-460f6c936a56";
if(ANFRAGE_KEY){
  $("anfrage").hidden=false;$("anfrageLink").hidden=false;
  $("aFach").innerHTML=FAECHER.map(f=>`<option>${esc(f.name)}</option>`).join("")+"<option>Anderes</option>";
  $("anfrageForm").addEventListener("submit",async e=>{
    e.preventDefault();
    const f=e.target,msg=$("aMsg"),btn=$("aSend");
    const data=new FormData(f);
    data.append("access_key",ANFRAGE_KEY);
    data.append("subject","Lernregal: Modul-Anfrage ("+$("aFach").value+")");
    data.append("from_name","Lernregal");
    btn.disabled=true;msg.className="msg";msg.textContent="Wird gesendet…";
    try{
      const r=await fetch("https://api.web3forms.com/submit",{method:"POST",headers:{Accept:"application/json"},body:data});
      const j=await r.json().catch(()=>({}));
      if(r.ok&&j.success){msg.className="msg ok";msg.textContent="Danke! Deine Anfrage ist angekommen.";f.reset();}
      else throw new Error(j.message||r.status);
    }catch(err){msg.className="msg err";msg.textContent="Senden hat nicht geklappt. Versuch es später nochmal.";}
    btn.disabled=false;
  });
}
</script>
<script src="regal.js" defer></script>
</body>
</html>
