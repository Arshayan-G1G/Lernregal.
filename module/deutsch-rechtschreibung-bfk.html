dass:{nav:"das / dass",title:"11 · das oder dass?",rule:`<ul>

const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pick=(a,n)=>shuf(a).slice(0,n);

const order=["lang","kurz","stamm","klang","dass","binde","dauer","mix"];
const NAV={dauer:"Dauerbrenner",mix:"Mix-Test"};
const nav=document.getElementById("nav"),main=document.getElementById("main");
let cur="lang";

function navBuild(){
  nav.innerHTML="";
  order.forEach(k=>{
    const b=document.createElement("button");b.type="button";b.id="nav-"+k;
    const n=T[k]?T[k].items.length:(k==="dauer"?DB.length:20);
    b.innerHTML=esc(T[k]?T[k].nav:NAV[k])+` <span class="count">${n}</span>`;
    b.setAttribute("aria-current",k===cur);
    b.onclick=()=>{cur=k;navBuild();render();window.scrollTo({top:0})};
    nav.appendChild(b);
  });
  const a=document.createElement("a");a.href="deutsch-kommasetzung.html";a.textContent="Kommasetzung ↗";nav.appendChild(a);
}

function quiz(container,items,onScore){
  const box=document.createElement("div");box.className="qs";
  let done=0,right=0;
  items.forEach((it,i)=>{
    const q=document.createElement("div");q.className="q";
    const head=document.createElement("div");head.className="qhead";
    const prompt=it.gap?esc(it.q).replace("___",'<span class="gap">&nbsp;</span>'):esc(it.q);
    head.innerHTML=`<span class="num">${String(i+1).padStart(2,"0")}</span><span class="prompt">${prompt}</span>`;
    const opts=document.createElement("div");opts.className="opts";
    const ex=document.createElement("div");ex.className="expl";ex.hidden=true;
    shuf([it.a,...it.w]).forEach(o=>{
      const b=document.createElement("button");b.type="button";b.textContent=o;
      b.onclick=()=>{
        const ok=o===it.a;done++;if(ok)right++;
        q.classList.add(ok?"right":"wrong");
        opts.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.textContent===it.a)x.classList.add("ok")});
        if(!ok)b.classList.add("no");
        const g=q.querySelector(".gap");if(g)g.textContent=it.a;
        ex.innerHTML=(ok?"✓ Richtig. ":"✗ Richtig ist <b>"+esc(it.a)+"</b>. ")+esc(it.e||"");ex.hidden=false;
        onScore(right,done,items.length);
      };
      opts.appendChild(b);
    });
    q.append(head,opts,ex);box.appendChild(q);
  });
  container.appendChild(box);
}

function header(sec,title,sub){
  const h=document.createElement("h2");h.textContent=title;
  const m=document.createElement("div");m.className="meta";
  const s=document.createElement("span");s.className="score";
  m.innerHTML=`<span>${esc(sub)}</span>`;m.appendChild(s);
  sec.append(h,m);return s;
}
const scoreFn=s=>(r,d,n)=>{s.textContent=`${r} / ${d} richtig · ${n-d} offen`};

function render(){
  main.innerHTML="";const sec=document.createElement("section");main.appendChild(sec);
  if(T[cur]){
    const t=T[cur];const s=header(sec,t.title,`${t.items.length} Übungen`);s.textContent=`0 / 0 richtig · ${t.items.length} offen`;
    const d=document.createElement("details");d.className="rule";d.open=true;d.innerHTML="<summary>Theorie</summary>"+t.rule;sec.appendChild(d);
    const tools=document.createElement("div");tools.className="tools";tools.style.marginTop="12px";
    const r=document.createElement("button");r.className="btn ghost";r.type="button";r.textContent="Neu mischen";r.onclick=render;tools.appendChild(r);sec.appendChild(tools);
    quiz(sec,shuf(t.items),scoreFn(s));
  } else if(cur==="dauer"){
    header(sec,"Dauerbrenner","100 Wörter, die oft falsch geschrieben werden");
    const d=document.createElement("details");d.className="rule";
    d.innerHTML="<summary>So lernst du sie</summary><ul><li>Fehlerjagd wie Übung A29: Tippe alle falsch geschriebenen Wörter an, dann «Prüfen».</li><li>Danach 20 Auswahlfragen. Mit «Neue Runde» kommen andere Wörter aus dem Pool ("+DB.length+" Wörter).</li><li>Spaghetti/Spagetti, Joghurt/Jogurt und Albtraum/Alptraum sind beide korrekt.</li></ul>";
    sec.appendChild(d);
    const h3=document.createElement("h2");h3.textContent="Fehlerjagd";h3.style.fontSize="20px";h3.style.marginTop="20px";sec.appendChild(h3);
    hunt(sec);
    const h4=document.createElement("h2");h4.textContent="Auswahl";h4.style.fontSize="20px";h4.style.marginTop="28px";
    const s=document.createElement("div");s.className="meta";const sc=document.createElement("span");sc.className="score";sc.textContent="0 / 0 richtig · 20 offen";s.innerHTML="<span>20 Wörter</span>";s.appendChild(sc);
    const tools=document.createElement("div");tools.className="tools";tools.style.marginTop="10px";
    const b=document.createElement("button");b.className="btn ghost";b.type="button";b.textContent="Neue Runde";b.onclick=render;tools.appendChild(b);
    sec.append(h4,s,tools);
    quiz(sec,pick(DB,20).map(([a,...w])=>M(a,w,"")),scoreFn(sc));
  } else {
    const all=[];Object.values(T).forEach(t=>all.push(...t.items));
    DB.forEach(([a,...w])=>all.push(M(a,w,"Dauerbrenner")));
    const items=pick(all,20);
    const s=header(sec,"Mix-Test","20 zufällige Aufgaben aus allen Kapiteln");s.textContent="0 / 0 richtig · 20 offen";
    const res=document.createElement("div");res.className="result";res.hidden=true;
    const tools=document.createElement("div");tools.className="tools";tools.style.marginTop="12px";
    const b=document.createElement("button");b.className="btn";b.type="button";b.textContent="Neuer Test";b.onclick=render;tools.appendChild(b);
    sec.append(tools);
    quiz(sec,items,(r,d,n)=>{s.textContent=`${r} / ${d} richtig · ${n-d} offen`;
      if(d===n){const p=Math.round(r/n*100);res.hidden=false;window.Lernregal&&Lernregal.fortschritt(p,"Mix-Test "+p+" %");res.textContent=`Resultat: ${r} von ${n} (${p} %). `+(p>=90?"Prüfungsreif.":p>=70?"Gut, die Fehler nochmals anschauen.":"Nochmals die Theorie der Kapitel mit Fehlern lesen.");}});
    sec.appendChild(res);
  }
}

function hunt(sec){
  const box=document.createElement("div");sec.appendChild(box);huntFill(box);
}
function huntFill(box){
  box.innerHTML="";
  const words=pick(DB,20),wrongIdx=new Set(pick([...Array(20).keys()],7));
  const grid=document.createElement("div");grid.className="hunt";
  const cells=words.map((w,i)=>{
    const shown=wrongIdx.has(i)?w[1+Math.floor(Math.random()*2)]:w[0];
    const b=document.createElement("button");b.type="button";b.textContent=shown;b.dataset.marked="0";
    b.onclick=()=>{if(grid.dataset.done)return;const m=b.dataset.marked==="1";b.dataset.marked=m?"0":"1";b.classList.toggle("marked",!m)};
    grid.appendChild(b);return {b,wrong:wrongIdx.has(i),right:w[0]};
  });
  const meta=document.createElement("div");meta.className="meta";meta.innerHTML="<span>7 von 20 Wörtern sind falsch geschrieben.</span>";
  const tools=document.createElement("div");tools.className="tools";tools.style.marginTop="12px";
  const chk=document.createElement("button");chk.className="btn";chk.type="button";chk.textContent="Prüfen";
  const nw=document.createElement("button");nw.className="btn ghost";nw.type="button";nw.textContent="Neue Wörter";
  const res=document.createElement("div");res.className="result";res.hidden=true;res.style.marginTop="12px";
  chk.onclick=()=>{
    if(grid.dataset.done)return;grid.dataset.done="1";let hit=0,fp=0;
    cells.forEach(c=>{const m=c.b.dataset.marked==="1";c.b.classList.remove("marked");
      if(c.wrong){c.b.classList.add(m?"hit":"miss");const s=document.createElement("small");s.textContent="→ "+c.right;c.b.appendChild(s);if(m)hit++}
      else if(m){c.b.classList.add("false");const s=document.createElement("small");s.textContent="war richtig";c.b.appendChild(s);fp++}});
    res.hidden=false;res.textContent=`${hit} von 7 Fehlern gefunden`+(fp?`, ${fp} richtige Wörter fälschlich markiert.`:".");
  };
  nw.onclick=()=>huntFill(box);
  tools.append(chk,nw);
  box.append(meta,grid,tools,res);
}

navBuild();render();
