<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Topografie Schweiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: Landeskarte als Hauptfläche, darunter das Fragepult — wie eine Kartentafel im Schulzimmer */
:root{
  --bg:#eef1f3; --panel:#ffffff; --ink:#18232c; --muted:#5d6b76; --line:#d3dae0;
  --red:#d52b1e; --water:#1f5fbf; --ok:#1d8a4e; --bad:#c62f24; --chip:#e3e8ec; --paper:#fbfbf8;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a20; --panel:#1b252d; --ink:#e7edf1; --muted:#9aa8b3; --line:#2e3b45;
  --red:#f0574a; --water:#6ea4ff; --ok:#3fc07a; --bad:#ff6b5e; --chip:#25313a; --paper:#f4f4f0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a20; --panel:#1b252d; --ink:#e7edf1; --muted:#9aa8b3; --line:#2e3b45;
  --red:#f0574a; --water:#6ea4ff; --ok:#3fc07a; --bad:#ff6b5e; --chip:#25313a; --paper:#f4f4f0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{font:800 clamp(28px,5vw,44px)/1 var(--f-display);font-stretch:85%;letter-spacing:-.01em;margin:0;text-wrap:balance;display:flex;align-items:center;gap:12px}
.flag{width:.9em;height:.9em;background:var(--red);border-radius:3px;position:relative;flex:none}
.flag::before,.flag::after{content:"";position:absolute;background:#fff;left:50%;top:50%;transform:translate(-50%,-50%)}
.flag::before{width:60%;height:18%}.flag::after{width:18%;height:60%}
.sub{color:var(--muted);margin:6px 0 0;font-size:15px}
.score{display:flex;gap:16px;font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.score b{color:var(--ink);font-size:20px;display:block;font-variant-numeric:tabular-nums}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.chip{border:1px solid transparent;background:var(--chip);color:var(--ink);font:600 15px var(--f-body);padding:7px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--ink);font:600 14px var(--f-body);padding:7px 12px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.mapbox{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:auto;position:relative;min-width:0}
.mapbox svg{display:block;width:100%;height:auto;touch-action:manipulation}
.mapbox.zoom svg{width:220%}
.maptools{position:sticky;left:0;top:0;display:flex;justify-content:flex-end;padding:8px;height:0;z-index:2}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:600 14px var(--f-body);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--red);color:#fff;border-color:transparent}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:14px;min-width:0}
.cat{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.q{font:700 22px/1.25 var(--f-display);font-stretch:90%;margin:0;text-wrap:balance}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:600 16px var(--f-body);padding:11px 14px;border-radius:10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel))}
.opt:disabled{cursor:default}
.fb{min-height:24px;font-weight:600}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.prog{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--red);transition:width .3s}
.meta{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.hint{color:var(--muted);font-size:14px;margin:0}
.done{text-align:center;display:grid;gap:10px}
.big{font:800 54px/1 var(--f-display);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{font-family:var(--f-mono);color:var(--muted);width:3.4em;white-space:nowrap}
.listwrap{max-height:520px;overflow:auto}
/* SVG markers */
.mk{fill:var(--red);stroke:#fff;cursor:pointer}
.mk.ok{fill:var(--ok)}.mk.no{fill:var(--bad)}
.ring{fill:none;stroke:var(--red)}
@keyframes pulse{0%{opacity:1}100%{opacity:.15}}
.ring.p{animation:pulse 1s ease-in-out infinite alternate}
.tag{font:700 13px var(--f-body);fill:#18232c;paint-order:stroke;stroke:#fbfbf8;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
@media (prefers-reduced-motion:reduce){.ring.p{animation:none}.prog i{transition:none}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div>
      <h1><span class="flag" aria-hidden="true"></span>Topografie Schweiz</h1>
      <p class="sub">Repetition «Topografisches Grundwissen Schweiz» · Geografie</p>
    </div>
    <div class="score"><div>Richtig<b id="sR">0</b></div><div>Falsch<b id="sF">0</b></div><div>Serie<b id="sS">0</b></div></div>
  </header>

  <div class="bar" id="cats"><span class="lbl">Thema</span></div>
  <div class="bar"><span class="lbl">Modus</span>
    <div class="seg" id="modes">
      <button data-m="what" aria-pressed="true">Was ist das?</button>
      <button data-m="where" aria-pressed="false">Wo liegt …?</button>
      <button data-m="learn" aria-pressed="false">Lernen</button>
    </div>
  </div>

  <div class="main">
    <div class="mapbox" id="mapbox">
      <div class="maptools"><button class="btn" id="zoomBtn" aria-pressed="false">Zoom +</button></div>
      <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="panel" id="panel"></div>
  </div>
</div>

  ["","Basel",440,112],["","Schaffhausen",714,48],["","Winterthur",744,124],["","Baden",640,136],["","Zürich",694,174],["","St. Gallen",910,156],["","Olten",534,188],["","Solothurn",428,228],["","Grenchen",392,240],["","Biel",358,254],["","Bern",410,338],["","Neuchâtel",272,304],["","Zug",694,248],["","Luzern",628,300],["","Altdorf",726,354],["","Sarnen",626,358],["","Yverdon",190,388],["","Fribourg",326,384],["","Thun",452,412],["","Interlaken",522,442],["","Chur",958,370],["","Lausanne",200,486],["","Montreux",274,518],["","Genf",60,600],["","Sion/Sitten",382,602],["","Bellinzona",834,618],["","Lugano",806,684]]},
 regionen:{name:"Regionen",map:"B",items:[
  ["1","Genf",49,599],["2","Waadt",190,435],["3","Freiberge",297,220],["4","Seeland",338,288],["5","Wallis",436,597],["6","Goms",606,513],["7","Berner Oberland",463,463],["8","Napfgebiet",536,314],["9","Fricktal",548,119],["10","Seetal",616,221],["11","Freiamt",648,198],["12","Zentralschweiz",699,319],["13","Reusstal",724,405],["14","Zürcher Oberland",773,203],["15","Zürcher Unterland",696,116],["16","Toggenburg",841,202],["17","Rheintal",969,179],["18","Nordbünden",1008,351],["19","Mittelbünden",958,442],["20","Surselva",846,413],["21","Engadin",1091,463],["22","Leventina",774,521]]}
};
const ART={seen:"der",fluesse:"der",gebirge:"der Gebirgszug",gletscher:"der",paesse:"der",orte:"",regionen:"die Region"};
const KEYS=Object.keys(CATS);
let cat="seen",mode="what",queue=[],cur=null,total=0,step=0,answered=false,R=0,F=0,S=0,roundR=0,missed=[];

const $=s=>document.querySelector(s);
const svg=$("#map"),panel=$("#panel");
const NS="http://www.w3.org/2000/svg";
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// Kategorie-Chips
const cb=$("#cats");
[...KEYS,"mix"].forEach(k=>{const b=document.createElement("button");b.className="chip";b.dataset.k=k;b.textContent=k==="mix"?"Alles gemischt":CATS[k].name;b.setAttribute("aria-pressed",k===cat);b.onclick=()=>{cat=k;sync();start()};cb.appendChild(b)});
document.querySelectorAll("#modes button").forEach(b=>b.onclick=()=>{mode=b.dataset.m;sync();start()});
function sync(){
  cb.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===cat));
  document.querySelectorAll("#modes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===mode));
  const mixLearn=cat==="mix"&&mode==="learn";if(mixLearn){cat="seen";sync()}
}
$("#zoomBtn").onclick=e=>{const z=$("#mapbox").classList.toggle("zoom");e.target.textContent=z?"Zoom −":"Zoom +";e.target.setAttribute("aria-pressed",z);requestAnimationFrame(draw)};
addEventListener("resize",()=>draw());
try{const s=JSON.parse(localStorage.getItem("topoCH")||"null");if(s&&(CATS[s.cat]||s.cat==="mix")){cat=s.cat;mode=s.mode||mode}}catch(e){}

// Fragen bauen
function makeQuestions(){
  const list=[];const cats=cat==="mix"?KEYS:[cat];
  cats.forEach(k=>CATS[k].items.forEach((it,i)=>{
    if(k==="gebirge"&&mode==="what"){
      const t=["range","peak","height"][Math.random()*3|0];list.push({k,i,t});
    }else list.push({k,i,t:"name"});
  }));
  let q=shuffle(list);if(cat==="mix")q=q.slice(0,20);return q;
}
function start(){
  try{localStorage.setItem("topoCH",JSON.stringify({cat,mode}))}catch(e){}
  answered=false;
  if(mode==="learn"){renderLearn();return}
  queue=makeQuestions();total=queue.length;step=0;roundR=0;missed=[];next();
}
function next(){
  answered=false;
  if(!queue.length){if(missed.length){queue=shuffle(missed);missed=[];total+=queue.length;}else{renderDone();return}}
  cur=queue.shift();step++;renderQ();draw();
}
function itemOf(q){return CATS[q.k].items[q.i]}
function label(k,it){return it[1]}
function questionText(q){
  const it=itemOf(q),c=CATS[q.k];
  if(mode==="where"){
    if(q.k==="gebirge")return it[1].endsWith("Alpen")?`Wo liegen die ${it[1]}?`:`Wo liegt der ${it[1]}?`;
    if(q.k==="orte")return `Wo liegt ${it[1]}?`;
    if(q.k==="regionen")return `Wo liegt die Region ${it[1]}?`;
    const die=["Aare","Saane","Reuss","Grosse Emme","Limmat","Linth","Thur","Birs","Rhone","Maggia"];
    const a=die.includes(it[1])?"die":"der";const nm=it[1]==="Grosser St. Bernhard"?"Grosse St. Bernhard":it[1];
    return `Wo ${q.k==="fluesse"?"fliesst":"liegt"} ${a} ${nm}?`;
  }
  const tag=it[0]?` <span style="font-family:var(--f-mono);color:var(--muted)">(${esc(it[0])})</span>`:"";
  if(q.t==="range")return `Welcher Gebirgszug ist markiert?${tag}`;
  if(q.t==="peak")return `${esc(it[1])}: Wie heisst die höchste Erhebung?`;
  if(q.t==="height")return `Wie hoch ist «${esc(it[4])}» (${esc(it[1])})?`;
  const w={seen:"Welcher See",fluesse:"Welcher Fluss",gletscher:"Welcher Gletscher",paesse:"Welcher Pass",orte:"Welcher Ort",regionen:"Welche Region"}[q.k];
  return `${w} ist markiert?${tag}`;
}
function options(q){
  const it=itemOf(q),items=CATS[q.k].items;
  const val=(x)=>q.t==="peak"?x[4]:q.t==="height"?x[5].toLocaleString("de-CH")+" m":x[1];
  const right=val(it);
  let pool=shuffle(items.filter(x=>x!==it).map(val)).filter((v,i,a)=>v!==right&&a.indexOf(v)===i);
  // ähnliche Distraktoren: bei Karte A Nachbarn bevorzugen
  if(q.t==="name"){const near=items.filter(x=>x!==it).sort((a,b)=>Math.hypot(a[2]-it[2],a[3]-it[3])-Math.hypot(b[2]-it[2],b[3]-it[3])).slice(0,4).map(val);pool=shuffle(near.slice(0,2)).concat(pool.filter(v=>!near.slice(0,2).includes(v)))}
  return shuffle([right,...pool.slice(0,3)]).map(v=>({v,ok:v===right}));
}
function renderQ(){
  const c=CATS[cur.k];const pct=Math.round((step-1)/total*100);
  let h=`<div class="meta"><span>Frage ${step} / ${total}</span><span>${roundR} richtig</span></div><div class="prog"><i style="width:${pct}%"></i></div>
  <div class="cat">${esc(c.name)}</div><h2 class="q">${questionText(cur)}</h2>`;
  if(mode==="what"){h+=`<div class="opts" id="opts">`+options(cur).map((o,i)=>`<button class="opt" data-ok="${o.ok}" id="o${i}">${esc(o.v)}</button>`).join("")+`</div>`}
  else h+=`<p class="hint">Tippe auf der Karte auf den richtigen Punkt.</p>`;
  h+=`<div class="fb" id="fb" role="status"></div><div style="display:flex;gap:8px"><button class="btn primary" id="nx" hidden>Weiter</button><button class="btn" id="skip">Überspringen</button></div>`;
  panel.innerHTML=h;
  panel.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answerOpt(b));
  $("#nx").onclick=next;$("#skip").onclick=()=>{if(!answered){missed.push(cur);mark(false,true)}};
}
function solutionText(q){const it=itemOf(q);
  if(q.k==="gebirge")return `${it[0]} = ${it[1]} · ${it[4]}, ${it[5].toLocaleString("de-CH")} m`;
  return (it[0]?it[0]+" = ":"")+it[1]}
function mark(ok,skipped){
  answered=true;
  if(ok){R++;S++;roundR++}else{if(!skipped)F++;S=0}
  $("#sR").textContent=R;$("#sF").textContent=F;$("#sS").textContent=S;
  const fb=$("#fb");fb.className="fb "+(ok?"ok":"no");fb.textContent=(ok?"Richtig! ":skipped?"Lösung: ":"Falsch. ")+solutionText(cur);
  $("#nx").hidden=false;$("#skip").hidden=true;$("#nx").focus();
}
function answerOpt(b){
  if(answered)return;const ok=b.dataset.ok==="true";
  panel.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.ok==="true")x.classList.add("ok")});
  if(!ok){b.classList.add("no");missed.push(cur)}
  mark(ok);draw();
}
let picked=null;
function answerMap(idx){
  if(answered||mode!=="where")return;picked=idx;const ok=idx===cur.i;if(!ok)missed.push(cur);mark(ok);draw();
}
function renderDone(){
  const pct=total?Math.round(roundR/total*100):0;
  panel.innerHTML=`<div class="done"><div class="cat">${cat==="mix"?"Alles gemischt":esc(CATS[cat].name)} · fertig</div><div class="big">${pct}%</div><p class="hint">${roundR} von ${total} Antworten richtig. Falsche Fragen kamen am Schluss nochmals.</p><button class="btn primary" id="again">Neue Runde</button></div>`;
  $("#again").onclick=start;cur=null;draw();
}
function renderLearn(){
  const c=CATS[cat];cur=null;
  let rows=c.items.map(it=>`<tr><td>${esc(it[0]||"·")}</td><td><b>${esc(it[1])}</b>${cat==="gebirge"?`<br><span style="color:var(--muted)">${esc(it[4])} · ${it[5].toLocaleString("de-CH")} m</span>`:""}</td></tr>`).join("");
  panel.innerHTML=`<div class="cat">Lernen · ${esc(c.name)}</div><h2 class="q">Alle ${c.items.length} ${esc(c.name)} auf einen Blick</h2><p class="hint">Tippe einen Punkt auf der Karte an, um ihn hervorzuheben.</p><div class="listwrap"><table>${rows}</table></div><button class="btn primary" id="go">Jetzt abfragen</button>`;
  $("#go").onclick=()=>{mode="what";sync();start()};
  draw();
}
// Karte zeichnen
let learnSel=-1;
function draw(){
  const k=cur?cur.k:(cat==="mix"?"seen":cat);const c=CATS[k];const im=IMG[c.map];
  svg.setAttribute("viewBox",`0 0 ${im.w} ${im.h}`);svg.innerHTML="";
  el("image",{href:im.src,x:0,y:0,width:im.w,height:im.h},svg);
  const s=im.w/Math.max(svg.clientWidth,1);const r=Math.max(7,7*s),ring=Math.max(20,18*s);
  if(mode==="learn"){
    c.items.forEach((it,i)=>{const sel=i===learnSel;
      const m=el("circle",{cx:it[2],cy:it[3],r:sel?r*1.5:r,class:"mk","stroke-width":2*s},svg);m.onclick=()=>{learnSel=i;draw()};
      const lab=sel?((it[0]?it[0]+" ":"")+it[1]):(c.map==="B"&&k!=="gebirge"?(it[0]||it[1]):"");
      if(lab){const t=el("text",{x:it[2]+r+4,y:it[3]+5,class:"tag","font-size":(sel?15:12)*s,"stroke-width":4*s},svg);t.textContent=lab}
    });return}
  if(!cur)return;
  const it=itemOf(cur);
  if(mode==="what"){
    el("circle",{cx:it[2],cy:it[3],r:ring,class:"ring"+(answered?"":" p"),"stroke-width":4*s},svg);
    el("circle",{cx:it[2],cy:it[3],r:r*.8,class:"mk"+(answered?" ok":""),"stroke-width":2*s},svg);
    if(answered){const t=el("text",{x:it[2]+ring+4,y:it[3]+5,class:"tag","font-size":15*s,"stroke-width":4*s},svg);t.textContent=it[1]}
  }else{
    c.items.forEach((x,i)=>{let cl="mk";if(answered){if(i===cur.i)cl+=" ok";else if(i===picked)cl+=" no"}
      const m=el("circle",{cx:x[2],cy:x[3],r:(answered&&(i===cur.i||i===picked))?r*1.4:r,class:cl,"stroke-width":2*s},svg);
      if(answered&&(i===cur.i||i===picked)){const t=el("text",{x:x[2]+r*1.4+4,y:x[3]+5,class:"tag","font-size":14*s,"stroke-width":4*s},svg);t.textContent=x[1]}
    });
  }
}
svg.addEventListener("click",e=>{
  const k=cur?cur.k:(cat==="mix"?"seen":cat);const c=CATS[k];
  if(!(mode==="where"&&cur)&&mode!=="learn")return;
  const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());
  let best=-1,bd=1e9;c.items.forEach((it,i)=>{const d=Math.hypot(it[2]-p.x,it[3]-p.y);if(d<bd){bd=d;best=i}});
  const s=IMG[c.map].w/svg.clientWidth;if(bd>34*s)return;
  if(mode==="learn"){learnSel=best;draw()}else answerMap(best);
});
sync();start();
</script>
