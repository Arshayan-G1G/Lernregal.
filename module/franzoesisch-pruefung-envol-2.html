<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Übungsprüfung Envol 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Newsreader:opsz,wght@6..72,500;6..72,700&display=swap">
<style>
/* Layout: Prüfungsblatt auf Häuschenpapier, wie der echte Test. Oben Wahl der Prüfung, Aufgaben untereinander, unten Abgabe mit Punkten und Note. */
:root{
  --paper:#f6f7fa; --sheet:#ffffff; --grid:#dfe6f3; --ink:#1c2230; --muted:#5d6678;
  --blue:#2c4aa0; --blue-soft:#e8edfb; --red:#c4302a; --red-soft:#fbe9e7; --green:#25764a; --green-soft:#e4f4ea; --line:#d6dbe6;
  --f-display:"Newsreader", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10131a; --sheet:#171b24; --grid:#1d2330; --ink:#e5e8ef; --muted:#9aa3b5;
  --blue:#8ea8ff; --blue-soft:#1e2742; --red:#ff7d72; --red-soft:#3a1d1c; --green:#6fd59c; --green-soft:#16301f; --line:#2a3140; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#10131a; --sheet:#171b24; --grid:#1d2330; --ink:#e5e8ef; --muted:#9aa3b5;
  --blue:#8ea8ff; --blue-soft:#1e2742; --red:#ff7d72; --red-soft:#3a1d1c; --green:#6fd59c; --green-soft:#16301f; --line:#2a3140; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:24px 80px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.1;margin:0;text-wrap:balance}
.lead{margin:6px 0 0;color:var(--muted)}
nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:18px 0;padding:6px;background:var(--sheet);border:1px solid var(--line);border-radius:10px}
nav.tabs button{flex:1;font:inherit;font-weight:700;padding:10px 6px;border:0;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;line-height:1.2}
nav.tabs button small{display:block;font-weight:400;font-size:12px;line-height:1.25;margin-top:2px}
nav.tabs .bst{white-space:nowrap;font-weight:700}
@media (max-width:560px){nav.tabs .lg{display:none}}
textarea.b{resize:none;line-height:1.5;padding:4px 3px;font-family:inherit;display:block}
nav.tabs button[aria-selected="true"]{background:var(--blue);color:var(--sheet)}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:22px 20px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:6px;font-size:14px}
.head b{font-size:16px}
.task{padding-top:22px}
.task h2{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:16px;margin:0;padding-bottom:4px;border-bottom:1px solid var(--muted)}
.task h2 .pt{font-style:italic;font-weight:400;font-size:14px;white-space:nowrap}
.task h2 .pt.got{font-style:normal;font-weight:700}
.instr{font-style:italic;margin:8px 0 10px;font-size:15px}
.ttl{font-weight:700;margin:0 0 4px}
.txt{line-height:2.2}
ol.rw{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:12px}
ol.rw li{padding-left:4px}
.rw .q u{text-decoration-thickness:1.5px;text-underline-offset:3px}
.rw .row{display:flex;gap:6px;align-items:flex-start;margin-top:4px}
.rw .row span{padding-top:4px}
.rw .row span{white-space:nowrap}
input.b{font:inherit;font-weight:700;color:var(--blue);background:transparent;border:0;border-bottom:2px solid var(--muted);padding:0 3px;min-width:3ch;max-width:100%}
input.full{flex:1;min-width:0;width:100%}
input.b:disabled{opacity:1}
.ok input.b,input.b.ok{border-color:var(--green);color:var(--green)}
.bad input.b,input.b.bad{border-color:var(--red);color:var(--red);text-decoration:line-through}
.sol{color:var(--red);font-weight:700;font-size:14px;margin-left:2px}
.fb{font-size:14px;margin-top:2px}
.fb .s{color:var(--red);font-weight:700}
.fb .hint{color:var(--muted)}
.own{font:inherit;font-size:13px;margin-left:8px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);background:var(--sheet);color:var(--muted);cursor:pointer}
.lines{display:flex;flex-direction:column;gap:12px;margin:0;padding-left:22px}
.lines .lbl{color:var(--muted);font-size:14px}
.rule{display:none;margin-top:10px;font-size:14px;background:var(--blue-soft);border-radius:8px;padding:8px 12px}
.done .rule{display:block}
.submit{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:inherit;font-weight:700;padding:11px 20px;border-radius:8px;border:0;background:var(--blue);color:var(--sheet);cursor:pointer}
.btn.alt{background:transparent;color:var(--blue);border:1px solid var(--blue)}
.result{margin-top:16px;padding:16px;border-radius:10px;background:var(--green-soft);display:flex;flex-wrap:wrap;gap:6px 28px;align-items:baseline}
.result.low{background:var(--red-soft)}
.result .big{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1}
.result small{display:block;color:var(--muted);font-size:13px}
.best{font-size:14px;color:var(--muted)}
.tip{font-size:14px;color:var(--muted);margin:10px 0 0}
.kind{display:inline-block;font-size:12.5px;color:var(--blue);background:var(--blue-soft);border-radius:99px;padding:1px 9px;margin-left:4px;vertical-align:1px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.opt{font:inherit;font-size:15px;line-height:1.3;padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer;text-align:left}
.opt:hover{border-color:var(--blue)}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:700}
.opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
.opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red);text-decoration:line-through}
.opt:disabled{cursor:default}
.rule p{margin:2px 0}
input.b::placeholder{color:var(--muted);font-weight:400;opacity:.8}
</style>

/* ===== Prüfung 5: Fehlerjagd. Jeder Satz hat genau einen Fehler. ===== */
{name:"Prüfung 5",theme:"Fehlerjagd",kind:"Fehler finden und korrigieren",tasks:[
 {t:"rewrite",topic:"adj",title:"L'adjectif",instr:"Chaque phrase contient une faute. Récrivez la phrase correcte.",items:[
  {q:"C'est une fille gentil.",a:["C'est une fille gentille."],h:"gentil → gentille (Konsonant doppelt)."},
  {q:"Il a acheté un nouveau ordinateur.",a:["Il a acheté un nouvel ordinateur."],h:"Vor Vokal: nouvel."},
  {q:"Elle porte une jupe bleu.",a:["Elle porte une jupe bleue."],h:"la jupe ist feminin: bleue."},
  {q:"Nous avons visité une ville belle.",a:["Nous avons visité une belle ville."],h:"beau / belle steht vor dem Nomen."},
  {q:"Ce sont des chaussures blanches et chers.",a:["Ce sont des chaussures blanches et chères."],h:"cher → chère, Plural chères."}]},
 {t:"rewrite",topic:"comp",title:"Le comparatif et le superlatif",instr:"Chaque phrase contient une faute. Récrivez la phrase correcte.",items:[
  {q:"Ce gâteau est plus bon que l'autre.",a:["Ce gâteau est meilleur que l'autre."],h:"plus bon gibt es nicht: meilleur."},
  {q:"Marie est aussi grande comme sa sœur.",a:["Marie est aussi grande que sa sœur."],h:"aussi … que."},
  {q:"C'est le plus haut montagne de Suisse.",a:["C'est la plus haute montagne de Suisse."],h:"la montagne ist feminin: la plus haute."},
  {q:"Mes sœurs sont plus sportif que moi.",a:["Mes sœurs sont plus sportives que moi."],h:"Adjektiv angleichen: sportives."},
  {q:"Ce sont les élèves les plus intelligents dans l'école.",a:["Ce sont les élèves les plus intelligents de l'école."],h:"Superlativ + de (de l'école)."}]},
 {t:"rewrite",topic:"art",title:"Les articles",instr:"Chaque phrase contient une faute. Récrivez la phrase correcte.",items:[
  {q:"Je mange du pain sans du beurre.",a:["Je mange du pain sans beurre."],h:"Nach sans kein Artikel."},
  {q:"Il a acheté un kilo des pommes.",a:["Il a acheté un kilo de pommes."],h:"Nach Mengenangabe nur de."},
  {q:"J'aime du chocolat.",a:["J'aime le chocolat."],h:"Nach aimer: bestimmter Artikel."},
  {q:"Elle ne mange pas de la viande.",a:["Elle ne mange pas de viande."],h:"Nach Verneinung nur de."},
  {q:"Il fait de le sport.",a:["Il fait du sport."],h:"de + le = du."},
  {q:"Je vais à le cinéma.",a:["Je vais au cinéma."],h:"à + le = au."}]},
 {t:"rewrite",topic:"pron",title:"Les pronoms",instr:"Chaque phrase contient une faute. Récrivez la phrase correcte.",items:[
  {q:"Je la donne un cadeau. (à ma mère)",a:["Je lui donne un cadeau."],h:"à + Person → lui."},
  {q:"Je leurs téléphone souvent. (à mes amis)",a:["Je leur téléphone souvent."],h:"leur als Pronomen hat nie ein -s."},
  {q:"Je l'ai pas vu. (le film)",a:["Je ne l'ai pas vu."],h:"ne steht vor dem Pronomen."},
  {q:"Il trouve les. (les clés)",a:["Il les trouve."],h:"Das Pronomen steht vor dem Verb."},
  {q:"Le prof vous explique la règle. (à toi et à moi)",a:["Le prof nous explique la règle."],h:"à toi et à moi → nous."}]},
 {t:"rewrite",topic:"refl",title:"Les verbes pronominaux",instr:"Chaque phrase contient une faute. Récrivez la phrase correcte.",items:[
  {q:"Hier, Paul s'a levé à sept heures.",a:["Hier, Paul s'est levé à sept heures."],h:"Reflexive Verben immer mit être."},
  {q:"Marie s'est habillé vite.",a:["Marie s'est habillée vite."],h:"Marie ist weiblich: habillée."},
  {q:"Nous nous avons dépêchés.",a:["Nous nous sommes dépêchés.","Nous nous sommes dépêchées."],h:"être, nicht avoir."},
  {q:"Les filles se sont amusés.",a:["Les filles se sont amusées."],h:"Weiblich Plural: -ées."},
  {q:"Tom et Léa s'est rencontrés au parc.",a:["Tom et Léa se sont rencontrés au parc."],h:"Zwei Personen: se sont."},
  {q:"Elle ne s'est reposée pas.",a:["Elle ne s'est pas reposée."],h:"ne … pas umschliesst se + être."}]},
 {t:"rewrite",topic:"neg",title:"La négation",instr:"Chaque phrase contient une faute. Récrivez la phrase correcte.",items:[
  {q:"Je ne vois pas personne.",a:["Je ne vois personne."],h:"personne ersetzt pas."},
  {q:"Personne ne m'a pas aidé.",a:["Personne ne m'a aidé."],h:"Personne ne … ohne pas."},
  {q:"Je n'ai vu rien.",a:["Je n'ai rien vu."],h:"rien steht vor dem Partizip."},
  {q:"Il n'a personne rencontré.",a:["Il n'a rencontré personne."],h:"personne steht nach dem Partizip."},
  {q:"Elle n'a plus des amis ici.",a:["Elle n'a plus d'amis ici."],h:"Nach Verneinung: de / d'."},
  {q:"Non, je n'ai encore pas fini.",a:["Non, je n'ai pas encore fini."],h:"ne … pas encore."}]},
 {t:"rewrite",topic:"poss",title:"L'adjectif possessif et démonstratif",instr:"Chaque phrase contient une faute. Récrivez la phrase correcte.",items:[
  {q:"Ma amie s'appelle Léa.",a:["Mon amie s'appelle Léa."],h:"Weiblich mit Vokal: mon."},
  {q:"Ce arbre est très vieux.",a:["Cet arbre est très vieux."],h:"Maskulin vor Vokal: cet."},
  {q:"Les enfants jouent avec leur jouets.",a:["Les enfants jouent avec leurs jouets."],h:"Mehrere Sachen: leurs."},
  {q:"Paul parle avec sa père.",a:["Paul parle avec son père."],h:"le père → son."},
  {q:"Cette livre est intéressant.",a:["Ce livre est intéressant."],h:"le livre ist maskulin: ce."},
  {q:"Nous aimons nos maison.",a:["Nous aimons notre maison."],h:"Eine Sache: notre."}]},
 {t:"rewrite",topic:"quest",title:"Les questions avec « est-ce qu(e/i) »",instr:"Chaque phrase contient une faute. Récrivez la phrase correcte.",items:[
  {q:"Où est-ce que tu habite ?",a:["Où est-ce que tu habites ?"],h:"tu habites mit -s."},
  {q:"Qu'est-ce qui tu fais ?",a:["Qu'est-ce que tu fais ?"],h:"Danach kommt ein Subjekt (tu): que."},
  {q:"Qui est-ce que a téléphoné ?",a:["Qui est-ce qui a téléphoné ?"],h:"Person als Subjekt: qui est-ce qui."},
  {q:"Pourquoi est-ce que il pleure ?",a:["Pourquoi est-ce qu'il pleure ?"],h:"Vor Vokal: qu'."},
  {q:"Qu'est-ce que te fait peur ?",a:["Qu'est-ce qui te fait peur ?"],h:"Sache als Subjekt: qu'est-ce qui."}]}
]},

  x:"Lundi matin, Lina et sa sœur Zoé {se sont réveillées^refl~se réveiller} à six heures. Lina a pris {sa^poss~ihre} {nouvelle^adj~nouveau} valise et Zoé a pris {son^poss~ihren} sac à dos. À la gare, elles ont acheté {des^art} croissants et une bouteille {d'^art} eau. Le TGV est {plus rapide^comp~+ rapide} {que^comp} la voiture. Pendant le voyage, Zoé {s'est endormie^refl~s'endormir}. Lina, elle, n'a {rien^neg~nichts} mangé."},
 {t:"text",each:1,topic:"mix",title:"À Paris",instr:"Complétez l'histoire. Le mot gris dans la case vous aide.",
  x:"À Paris, les filles ont retrouvé {leur^poss~ihre} tante Claire. Claire a montré la ville {aux^art~à + les} filles. « {Qu'est-ce que^quest~was} vous voulez voir ? » demande Claire. Zoé répond : « La tour Eiffel ! C'est le monument {le plus célèbre^comp~!+ célèbre} {de^comp} Paris. » Elles {y^pron~dorthin} sont allées en métro. {Cette^poss~diese} tour est vraiment {belle^adj~beau}, mais il y avait beaucoup {de^art} touristes. Après la visite, Claire {leur^pron~ihnen} a acheté une glace."},
 {t:"text",each:1,topic:"mix",title:"Un petit problème",instr:"Complétez l'histoire. Le mot gris dans la case vous aide.",
  x:"Mercredi, Zoé ne trouvait plus {son^poss~ihr} portable. Elle l'a cherché partout, mais elle ne {l'^pron~es} a pas trouvé. « {Qui est-ce qui^quest~wer} a vu mon portable ? » {Personne^neg~niemand} ne l'avait vu. Finalement, Lina l'a trouvé sous {un^art} coussin. Les deux sœurs {se sont disputées^refl~se disputer}, puis elles {se sont réconciliées^refl~se réconcilier}. Le soir, elles ont mangé dans un {vieil^adj~vieux} hôtel transformé en restaurant."},
 {t:"text",each:1,topic:"mix",title:"Le retour",instr:"Complétez l'histoire. Le mot gris dans la case vous aide.",
  x:"Dimanche, Claire a demandé : « {Pourquoi est-ce que^quest~warum} vous partez déjà ? » – « Parce que l'école commence lundi ! » Les filles n'avaient {plus^neg~nicht mehr} {d'^art} argent, mais elles étaient {heureuses^adj~heureux}. Dans le train, Lina a dit : « La vie à Paris est {plus chère^comp~+ cher} {que^comp} la vie à Zurich. » À la maison, elles ont tout raconté à {leurs^poss~ihren} parents. Leur père a demandé : « {Est-ce que^quest~Frage ohne Fragewort} vous avez rencontré quelqu'un ? » – « Non, nous n'avons rencontré {personne^neg~niemand}. » Le soir, les filles {se sont couchées^refl~se coucher} tôt."}
]},

/* ===== Prüfung 8: Schnelltest mit Auswahl und Umformen ===== */
{name:"Prüfung 8",theme:"Schnelltest",kind:"Auswählen und Umformen",tasks:[

  {q:"___ chaussures sont neuves. (diese)",o:["Ce","Cette","Ces"],c:2},
  {q:"Marie sort avec ___ frère.",o:["sa","son","ses"],c:1}]},
 {t:"mc",each:1,topic:"quest",title:"Les questions avec « est-ce qu(e/i) »",instr:"La partie soulignée est la réponse. Choisissez la bonne question.",items:[

/* ---------- Themen und Regeln ---------- */
const TOPICS={adj:"Adjektive",comp:"Komparativ und Superlativ",art:"Artikel",pron:"Pronomen",refl:"Reflexive Verben",neg:"Verneinung",poss:"Possessiv und Demonstrativ",quest:"Fragen mit est-ce que"};
const ORDER=Object.keys(TOPICS);
const RULES={};
EXAMS[0].tasks.forEach((t,i)=>{RULES[ORDER[i]]=t.rule;});
/* Prüfungen 1–4 haben die Themen in der Reihenfolge der echten Prüfung */
EXAMS.forEach((e,ei)=>e.tasks.forEach((t,i)=>{if(!t.topic&&ei<4)t.topic=ORDER[i];}));

/* ---------- Hilfen ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>s.normalize("NFC").toLowerCase().replace(/[’`´‘]/g,"'").replace(/œ/g,"oe").replace(/\s*'\s*/g,"'").replace(/[–—]/g,"-").replace(/\s*-\s*/g,"-").replace(/[«»"]/g,"").replace(/[.!?,;:]/g," ").replace(/\s+/g," ").trim().replace(/^non /,"");
const noAcc=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"");
const noHy=s=>s.replace(/-/g," ");
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const fmtPt=n=>(Math.round(n*2)/2).toString().replace(".",",");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
/* Lücke: {antwort|andere^thema~hilfe} */
function spec(raw){let s=raw,hint="",topic="";const ti=s.indexOf("~");if(ti>=0){hint=s.slice(ti+1);s=s.slice(0,ti);}const pi=s.indexOf("^");if(pi>=0){topic=s.slice(pi+1);s=s.slice(0,pi);}return {sols:s.split("|"),topic,hint};}
function blanks(x){return [...x.matchAll(/\{([^}]+)\}/g)].map(m=>spec(m[1]));}
function taskMax(t){if(t.t==="text")return blanks(t.x).length*t.each;if(t.t==="mc")return t.items.length*(t.each||1);return t.items.length;}
const MAX=e=>e.tasks.reduce((s,t)=>s+taskMax(t),0);
function judge(val,sols){
  const v=norm(val),S=sols.map(norm);
  if(!v)return {ok:false,msg:""};
  if(S.includes(v))return {ok:true};
  if(S.map(noAcc).includes(noAcc(v)))return {ok:false,msg:"Fast! Akzent prüfen."};
  if(S.map(noHy).includes(noHy(v)))return {ok:false,msg:"Fast! Bindestrich prüfen."};
  return {ok:false,msg:""};
}

/* ---------- Aufbau ---------- */
const FIXED=window.FIXED_EXAM||0;
let cur=FIXED?FIXED-1:0;
const h=location.hash.match(/^#p([1-8])$/);if(h&&!FIXED)cur=+h[1]-1;
const tabs=document.getElementById("tabs");
if(FIXED)tabs.hidden=true;
function drawTabs(){
  tabs.innerHTML=EXAMS.map((e,i)=>{const b=store.get("envol78_best_"+i);
    return `<button role="tab" id="tab-p${i+1}" aria-selected="${i===cur}" data-i="${i}"><span class="lg">Prüfung </span>${i+1}<small>${esc(e.theme)}${b?` <span class="bst">${b} %</span>`:""}</small></button>`}).join("");
  tabs.querySelectorAll("button").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;drawTabs();draw();window.scrollTo({top:0});});
}
let uid=0;
function inp(sols,cls="",topic="",hint=""){
  const w=Math.max(...sols.map(s=>s.length),hint.length)+2;
  const id="f"+(++uid);
  if(cls==="full")return `<textarea class="b full" id="${id}" rows="2" data-sol="${esc(JSON.stringify(sols))}" data-topic="${topic}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Antwort"></textarea>`;
  return `<input class="b ${cls}" id="${id}" data-sol="${esc(JSON.stringify(sols))}" data-topic="${topic}"${hint?` placeholder="${esc(hint)}"`:""} style="width:${Math.min(w,30)}ch" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${hint?esc("Lücke: "+hint):"Lücke"}">`;
}
function textWithBlanks(x,topic){
  let out="",last=0;
  for(const m of x.matchAll(/\{([^}]+)\}/g)){out+=esc(x.slice(last,m.index));const b=spec(m[1]);out+=inp(b.sols,"",b.topic||topic,b.hint);last=m.index+m[0].length;}
  return out+esc(x.slice(last));
}
function under(q){return esc(q).replace(/\[([^\]]+)\]/g,"<u>$1</u>");}

function draw(){
  const e=EXAMS[cur],max=MAX(e);uid=0;stat={};
  if(!FIXED)history.replaceState(null,"","#p"+(cur+1));
  let html=`<div class="sheet"><div class="head"><span><b>Test de grammaire : Répétition Envol 7 et 8</b><br>${esc(e.name)}: ${esc(e.theme)}${e.kind?` <span class="kind">${esc(e.kind)}</span>`:""}</span><span>Points : <b id="pts">…</b> / ${fmtPt(max)}<br>Note : <b id="note">…</b></span></div>`;
  e.tasks.forEach((t,ti)=>{
    html+=`<section class="task" data-t="${ti}"><h2><span>${ti+1}. ${esc(t.title)}</span><span class="pt" id="tp${ti}">${fmtPt(taskMax(t))} points</span></h2><p class="instr">${esc(t.instr)}</p>`;
    if(t.ttl)html+=`<p class="ttl">${esc(t.ttl)}</p>`;
    if(t.sub)html+=`<p class="instr" style="margin-top:0">${esc(t.sub)}</p>`;
    if(t.t==="text")html+=`<p class="txt">${textWithBlanks(t.x,t.topic)}</p>`;
    if(t.t==="lines")html+=`<ol class="lines">${t.items.map(it=>`<li><span class="lbl">${esc(it.l)}</span><br>${textWithBlanks(it.x,t.topic)}</li>`).join("")}</ol>`;
    if(t.t==="rewrite")html+=`<ol class="rw">${t.items.map((it,ii)=>`<li data-ii="${ii}"><span class="q">${under(it.q)}</span><div class="row">${t.pre?`<span>${esc(t.pre)}</span>`:""}${inp(it.a,"full",it.topic||t.topic)}</div><div class="fb"></div></li>`).join("")}</ol>`;
    if(t.t==="mc")html+=`<ol class="rw mc">${t.items.map((it,ii)=>`<li data-ii="${ii}"><span class="q">${under(it.q).replace("___","<b>___</b>")}</span><div class="opts" role="group">${shuffle(it.o.map((_,j)=>j)).map(j=>`<button type="button" class="opt" data-j="${j}" aria-pressed="false">${esc(it.o[j])}</button>`).join("")}</div><div class="fb"></div></li>`).join("")}</ol>`;
    html+=`<div class="rule"></div></section>`;
  });
  const best=store.get("envol78_best_"+cur);
  html+=`<div class="submit"><button class="btn" id="go">Abgeben und korrigieren</button><button class="btn alt" id="reset">Neu beginnen</button>${best?`<span class="best">Bestes Resultat: ${best} %</span>`:""}</div><div id="res"></div>`;
  html+=`<p class="tip">Tipp: Enter springt zur nächsten Lücke. Bei ganzen Sätzen kannst du nach der Korrektur «Doch richtig» drücken, wenn deine Lösung auch stimmt.</p></div>`;
  document.getElementById("exam").innerHTML=html;
  const ins=[...document.querySelectorAll("#exam .b")];
  ins.forEach((el,k)=>el.addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();(ins[k+1]||document.getElementById("go")).focus();}}));
  document.querySelectorAll("#exam .opts").forEach(g=>g.addEventListener("click",ev=>{const b=ev.target.closest(".opt");if(!b||b.disabled)return;
    g.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");}));
  document.getElementById("go").onclick=correct;
  document.getElementById("reset").onclick=()=>{draw();window.scrollTo({top:0});};
}

/* Punkte pro Thema, für «Nochmal anschauen» */
let stat={};
const add=(tp,g,m)=>{if(!tp)return;stat[tp]=stat[tp]||{g:0,m:0};stat[tp].g+=g;stat[tp].m+=m;};
function correct(){
  const e=EXAMS[cur];let total=0;stat={};
  document.querySelectorAll("#exam section.task").forEach(sec=>{
    const ti=+sec.dataset.t,t=e.tasks[ti];let got=0;const miss=new Set();sec.classList.add("done");
    if(t.t==="rewrite"){
      sec.querySelectorAll("li[data-ii]").forEach(li=>{
        const it=t.items[+li.dataset.ii],el=li.querySelector(".b"),tp=it.topic||t.topic,r=judge(el.value,it.a);el.disabled=true;
        el.classList.add(r.ok?"ok":"bad");add(tp,r.ok?1:0,1);
        if(r.ok)got+=1;
        else{miss.add(tp);li.querySelector(".fb").innerHTML=`${r.msg?`<span class="hint">${r.msg}</span> `:""}Lösung: <span class="s">${esc((t.pre||"")+it.a[0])}</span>${it.h?` <span class="hint">${esc(it.h)}</span>`:""}${el.value.trim()?`<button class="own" type="button">Doch richtig</button>`:""}`;
          const ob=li.querySelector(".own");if(ob)ob.onclick=()=>{ob.remove();el.classList.remove("bad");el.classList.add("ok");add(tp,1,0);addPoint(sec,ti,1);};}
      });
    }else if(t.t==="mc"){
      const each=t.each||1;
      sec.querySelectorAll("li[data-ii]").forEach(li=>{
        const it=t.items[+li.dataset.ii],tp=it.topic||t.topic,sel=li.querySelector('.opt[aria-pressed="true"]'),ok=!!sel&&+sel.dataset.j===it.c;
        li.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(+b.dataset.j===it.c)b.classList.add("right");else if(b===sel)b.classList.add("wrong");});
        add(tp,ok?each:0,each);if(ok)got+=each;else{miss.add(tp);if(!sel)li.querySelector(".fb").innerHTML=`<span class="hint">Nichts gewählt.</span>`;}
      });
    }else{
      const lines=t.t==="lines"?[...sec.querySelectorAll("ol.lines>li")]:[sec];
      lines.forEach(ln=>{
        const els=[...ln.querySelectorAll("input")];const per=t.t==="lines"?1/els.length:t.each;
        els.forEach(el=>{const sols=JSON.parse(el.dataset.sol),tp=el.dataset.topic||t.topic,r=judge(el.value,sols);el.disabled=true;el.classList.add(r.ok?"ok":"bad");
          add(tp,r.ok?per:0,per);
          if(r.ok)got+=per;else{miss.add(tp);el.insertAdjacentHTML("afterend",`<span class="sol">${esc(sols[0])}</span>`);}});
      });
    }
    /* Regel: bei einem Thema immer, bei gemischten Teilen nur zu den Fehlern */
    const box=sec.querySelector(".rule");
    if(t.topic&&t.topic!=="mix")box.innerHTML=`<b>Regel:</b> ${esc(t.rule||RULES[t.topic]||"")}`;
    else box.innerHTML=miss.size?[...miss].map(tp=>`<p><b>${esc(TOPICS[tp]||tp)}:</b> ${esc(RULES[tp]||"")}</p>`).join(""):"<b>Alles richtig in diesem Teil.</b>";
    sec.dataset.got=got;total+=got;
    const tp=document.getElementById("tp"+ti);tp.innerHTML=`${fmtPt(got)} / ${fmtPt(taskMax(t))} points`;tp.classList.add("got");
  });
  document.getElementById("go").disabled=true;
  showResult(total);
  document.getElementById("res").scrollIntoView({behavior:"smooth",block:"center"});
}
function addPoint(sec,ti,n){
  const t=EXAMS[cur].tasks[ti];sec.dataset.got=+sec.dataset.got+n;
  document.getElementById("tp"+ti).innerHTML=`${fmtPt(+sec.dataset.got)} / ${fmtPt(taskMax(t))} points`;
  let total=0;document.querySelectorAll("#exam section.task").forEach(s=>total+=+s.dataset.got);showResult(total);
}
function showResult(total){
  const max=MAX(EXAMS[cur]),pct=Math.round(total/max*100);
  const note=Math.round((1+5*total/max)*10)/10,noteR=Math.round((1+5*total/max)*4)/4;
  document.getElementById("pts").textContent=fmtPt(total);
  document.getElementById("note").textContent=note.toFixed(1);
  const weak=ORDER.filter(tp=>stat[tp]&&stat[tp].m&&stat[tp].g/stat[tp].m<0.7).map(tp=>TOPICS[tp]);
  document.getElementById("res").innerHTML=`<div class="result ${note<4?"low":""}" role="status"><div><span class="big">${fmtPt(total)} / ${fmtPt(max)}</span><small>Punkte (${pct} %)</small></div><div><span class="big">${note.toFixed(1)}</span><small>Note (gerundet auf Viertel: ${noteR.toFixed(2)})</small></div>${weak.length?`<div style="flex-basis:100%;font-size:14px">Nochmal anschauen: ${weak.map(esc).join(", ")}</div>`:`<div style="flex-basis:100%;font-size:14px">Stark! In allen Themen über 70 %.</div>`}</div>`;
  const old=+(store.get("envol78_best_"+cur)||0);if(pct>old){store.set("envol78_best_"+cur,pct);if(!FIXED)drawTabs();}
  if(window.Lernregal)Lernregal.fortschritt(pct,`${EXAMS[cur].name}: Note ${note.toFixed(1)} (${pct} %)`);
}
drawTabs();draw();
</script>
